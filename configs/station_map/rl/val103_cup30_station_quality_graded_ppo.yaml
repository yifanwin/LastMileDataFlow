# Station-quality stage 1, graded phase (s1r1 diagnosis): historical typed collision penalties and the
# stuck termination teach the grasp; only joint limits terminate strictly (-10). Strict-clean success
# (success with no contact of the termination.clean classes) is logged. The strict phase then starts
# from this policy with val103_cup30_station_quality_ppo.yaml plus training.init_checkpoint.
# rollout_steps 16: 8 GPUs x 512 envs give ~65k samples per update, matching the historical 4-GPU runs.
scene:
  data_root: /data1/wenyifan/lmdf/molmospaces_data
  scene_xml: assets/scenes/procthor-10k-val/val_103.xml
  scene_metadata: assets/scenes/procthor-10k-val/val_103_metadata.json
  robot_xml: assets/robots/panda_omron/model.xml
  target: Cup_30
  local_radius_m: 2.0
  physics_dt: 0.002
  multiccd: false
  home:
  - 0.0
  - -0.00365045915
  - 0.0
  - -2.61799387799
  - 0.0
  - 2.74159265359
  - 0.78539816339
  lift: 0.2
  robot_scale: 0.9
  fixed_base: true
  home_noise_rad: 0.05
observation:
  mode: flat
  layout: station
  world_state: false
mjlab_source: /home/wenyifan/wenyifan/lmdf/LastMileDataFlow/reference_repos/mjlab
environment:
  num_envs: 128
  decimation: 25
  episode_s: 20
  settling_s: 1.0
  nconmax: 5000
  njmax: 5000
action:
  translation_m: 0.02
  rotation_rad: 0.08726646259971647
  damping: 0.05
  joint_limit_weight: 1.0
  lift_velocity_m_s: 0.05
  gripper_step: 0.2
reward:
  position: 20.0
  rotation: 5.0
  success: 30.0
  close: 3.0
  grasp: 3.0
  lift: 8.0
  grasp_distance_m: 0.03
  grasp_angle_rad: 0.3490658503988659
  pregrasp_offset_m: 0.1
  pregrasp_tolerance_m: 0.02
  pregrasp_tolerance_rad: 0.17453292519943295
  descent_lateral_weight: 3.0
  closing_requires_contact: false
  closing_distance_m: 0.01
  closing_angle_rad: 0.17453292519943295
  finger_inner_cos: 0.5
  drop_height_m: 0.3
  drop_penalty: 20.0
  failure: 10.0
  collision_tiers:
    small:
    - 0.5
    - 0.1
    medium:
    - 0.8
    - 0.5
    large:
    - 1.0
    - 0.5
  collision_rearm_s: 0.25
  stuck:
    window_s: 2.0
    collision_fraction: 0.5
    tcp_path_m: 0.02
    distance_gain_m: 0.005
    angle_gain_rad: 0.05
    penalty: 10.0
algorithm: ppo
ppo:
  rollout_steps: 16
training:
  best_checkpoint:
    window_episodes: 200
    start_transitions: 600000
    metric: success_rate
  periodic_evaluation: false
  batch_size: 512
  replay_capacity: 100000
  warmup_min: 20000
  transitions_per_update: 128
  debug_station_ids: []
  log_every: 10000
  max_transitions: 5000000
  tensorboard_every_seconds: 30
  validation_stations: 1
  validation_rollouts_per_station: 16
stations:
  robot_config: configs/robots/panda_omron.yaml
  heading_offsets_deg:
  - 0
  seed: 42
  radius_scale: 1.2
  spacing_scale: 1.2
evaluation:
  action_samples: 16
  top: 4
  middle: 4
  low: 4
  uniform: 8
  rollouts_per_station: 1
  seed: 20261109
  q_color_limits:
  - -100.0
  - 100.0
  station_count: 20
acceptance:
  top_success_min: 0.5
  top_collision_free_success_min: 0.4
  top_uniform_gap_min: 0.1
  positive_spearman: true
success:
  version: rl-pick-contact-v2
  finger_force_min_n: 0.5
  pad_contact: true
  lift_m: 0.01
  hold_s: 0.25
video:
  every: 100000
  width: 640
  height: 480
grasp:
  preprocessed_path: outputs/experiments/grasp-fps-all/runs/cup30-panda09-rays21-ratio30-hand3mm-sym-fps128/grasps.npz
  sample_count: 16
  sample_seed: 42
  roll_rad: 1.5707963267948966
  align_to_tcp: true
  axis_steps: 72
termination:
  illegal: []
  joint_tolerance_rad: 0.01
  joint_tolerance_m: 0.002
  clean:
  - finger_outer
  - palm_target
  - finger_table
  - arm_target
  - robot_scene
  - self
noise:
  sigma_max: 0.0
  action: 0.1
  target_m: 0.005
  dock_m: 0.05
  dock_yaw_rad: 0.08726646259971647

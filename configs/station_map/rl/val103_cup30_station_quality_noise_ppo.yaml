  - 0.0
  - -2.61799387799
  - 0.0
  - 2.74159265359
  - 0.78539816339
  lift: 0.2
  robot_scale: 0.9
  fixed_base: true
  home_noise_rad: 0.05
observation:
  mode: flat
  layout: station
  world_state: false
mjlab_source: /home/wenyifan/wenyifan/lmdf/LastMileDataFlow/reference_repos/mjlab

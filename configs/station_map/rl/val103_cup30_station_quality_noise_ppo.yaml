# Station-quality stage 2: strict termination with the sigma curriculum (plan 04 section 7).
# Start from the stage-1 strict policy via training.init_checkpoint; the ceiling rises through
# 0.1, 0.25, 0.5, 0.75, 1.0 when the low/high-noise training windows reach 0.8 / 0.75 after >= 1M per level.
# Stations use all planned headings (0, +-30, +-60 deg); the heading-expanded strict stage-1 policy is the start.

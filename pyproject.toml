[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lastmile-dataflow"
version = "0.3.0"
description = "Rule-based scene construction, RBY-1 execution and evidence"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "mujoco>=3.5,<4", "imageio>=2.34", "imageio-ffmpeg>=0.5", "jsonschema>=4.18,<5"]

[project.optional-dependencies]
phase3 = ["torch>=2.5", "PyYAML>=6", "trimesh>=4", "matplotlib>=3.8", "Pillow>=10"]

[project.scripts]
lastmile-dataflow = "lastmile_dataflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lastmile-dataflow"
version = "0.3.0"
description = "Rule-based scene construction, RBY-1 execution and evidence"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.15",
    "mujoco==3.5.0",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "matplotlib>=3.8",
    "Pillow>=10",
    "torch==2.7.1+cu128",
    "torchvision==0.22.1+cu128",
    "transformers==5.4.0",
    "pydantic>=2",
    "einops>=0.8",
    "PyYAML>=6",
    "cuda-core[cu12]>=0.7,<2",
    "nvidia-cuda-runtime-cu12<13",
    "warp-lang==1.11.1",
    "nvidia-curobo[cu12] @ git+https://github.com/NVlabs/curobo.git@v0.8.0",
]

[project.optional-dependencies]
panda-factory = ["numba>=0.61", "qpsolvers[quadprog]>=4", "opencv-python-headless>=4.11", "termcolor>=3", "tqdm>=4"]
pi05-data = ["lerobot==0.3.3", "datasets==3.6.0"]

[project.scripts]
lastmile-dataflow = "lastmile_dataflow.cli:main"

[dependency-groups]
pi05 = [
    "jax[cuda12]==0.5.3",
    "flax==0.10.2",
    "orbax-checkpoint==0.11.13",
    "numpy==1.26.4",
    "ml-dtypes==0.4.1",
    "tensorstore==0.1.74",
    "augmax>=0.3.4",
    "einops>=0.8",
    "jaxtyping==0.2.36",
    "beartype==0.19.0",
    "sentencepiece>=0.2",
    "Pillow>=10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lastmile_dataflow.planning.robots" = ["assets/panda_omron/*"]
"lastmile_dataflow.policies.multitask" = ["LICENSE", "NOTICE"]
"lastmile_dataflow.policies.pi05.core" = ["LICENSE", "NOTICE"]
"lastmile_dataflow.runtime.control" = ["ROBOSUITE_LICENSE"]
